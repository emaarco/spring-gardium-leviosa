spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    http:
      path: /api/graphql
    websocket:
      path: /api/graphql-ws
  kafka:
    bootstrap-servers: localhost:9092

server:
  port: 8084

pod:
  name: ${POD_NAME:pod-1}

pod-broadcast:
  pod-name: ${pod.name}
  topic: order-status-changes

order-fulfillment:
  step-delay: 10s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,podBroadcast
