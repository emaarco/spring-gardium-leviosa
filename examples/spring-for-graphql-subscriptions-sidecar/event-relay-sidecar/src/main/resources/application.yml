spring:
  application:
    name: event-relay-sidecar
  threads:
    virtual:
      enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: latest

server:
  port: 8096

pod:
  name: ${POD_NAME:pod-1}

relay:
  topic: order-status-changes
  delivery-url: http://localhost:8086/internal/order-status-changes

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,brokerEventListener
