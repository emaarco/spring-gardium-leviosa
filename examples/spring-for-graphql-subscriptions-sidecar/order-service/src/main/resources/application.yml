spring:
  application:
    name: order-service
  threads:
    virtual:
      enabled: true
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    http:
      path: /api/graphql
    websocket:
      path: /api/graphql-ws

server:
  port: 8086

pod:
  name: ${POD_NAME:pod-1}

event-relay-sidecar:
  url: http://localhost:8096

order-fulfillment:
  step-delay: 10s

management:
  endpoints:
    web:
      exposure:
        include: health
